<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debit Submit</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  padding:20px;
  color:white;
  background:
    radial-gradient(circle at top left,rgba(59,130,246,.45),transparent 35%),
    radial-gradient(circle at bottom right,rgba(34,197,94,.35),transparent 40%),
    #07132d;
}

.loading{
  position:fixed;
  inset:0;
  background:#07132d;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  font-weight:bold;
  z-index:9999;
}

.card{
  max-width:480px;
  margin:35px auto;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  padding:26px;
  border-radius:26px;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 40px rgba(34,197,94,.25),0 0 80px rgba(59,130,246,.18);
}

.logoWrap{text-align:center;margin-bottom:22px;}

.logoCircle{
  width:95px;
  height:95px;
  margin:0 auto 14px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(135deg,#22c55e,#3b82f6);
  box-shadow:0 0 22px rgba(34,197,94,.65),0 0 45px rgba(59,130,246,.45);
}

.logoCircle img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logoText{
  font-size:36px;
  font-weight:900;
  color:white;
}

.logoWrap h1{font-size:29px;margin-bottom:5px;}
.subtitle{color:#cbd5e1;font-size:14px;}

input,select,button{
  width:100%;
  padding:15px;
  font-size:20px;
  border:none;
  outline:none;
  border-radius:12px;
  margin-bottom:15px;
  text-align:center;
}

input,select{
  background:#0f172a;
  color:white;
  border:1px solid rgba(255,255,255,.15);
}

input:focus,select:focus{
  border-color:#22c55e;
  box-shadow:0 0 16px rgba(34,197,94,.35);
}

select{
  background:#16a34a;
  color:white;
  font-weight:bold;
}

button{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.result{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  min-height:50px;
  text-align:center;
}

.payable{
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.25);
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#4ade80;
  word-break:break-word;
}

.methodCard{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
}

.methodLogo{
  width:64px;
  height:64px;
  border-radius:14px;
  background:white;
  padding:5px;
  object-fit:contain;
}

.methodName{
  font-size:18px;
  font-weight:900;
  color:white;
}

.methodValue{
  font-size:17px;
  color:#4ade80;
}

.success{background:rgba(22,163,74,.9);}
.error{background:rgba(220,38,38,.9);}
.hidden{display:none;}
</style>
</head>

<body>

<div id="loading" class="loading">🖨️  Scaning...</div>

<div class="card">

  <div class="logoWrap">
    <div class="logoCircle">
      <img id="mainLogo" src="https://raw.githubusercontent.com/ariyanth1000-jpg/Withdraw-logo-gif/main/original-c2e99dc48ea0774caa9b5d9d886c0d2b.gif" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='block';">
      <div id="logoFallback" class="logoText" style="display:none;">TA</div>
    </div>
    <h1> Withdrawal Request </h1>
    <div class="subtitle">Secure Debit System</div>
  </div>

  <input type="text" id="searchBox" placeholder="Enter Password" autocomplete="off">

  <div id="result" class="result"></div>

  <div id="amountArea" class="hidden">

    <select id="methodBox"></select>

    <div id="methodValueBox" class="payable">
      Selected Value : -
    </div>

    <input type="number" id="amountBox" placeholder="Enter Amount" min="0" step="1">

    <div id="payableBox" class="payable">
      Payable : 0 TK
    </div>

    <button onclick="submitAmount()">Submit</button>
  </div>
</div>

<script>
const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzBJpScRYLgV1YMTIExhdyiMQaUxcG0rjbjr5BW0fON3WKYv3Xp9LOEKUhqe8ecgQcO4Q/exec";

const methodLogos = {
  Bkash: "https://raw.githubusercontent.com/ariyanth1000-jpg/Bkash-logo/main/990db4ce-6fdd-4781-a1e7-605ff9cfed0f.webp",
  Nagad: "https://raw.githubusercontent.com/ariyanth1000-jpg/Nagad-logo/main/683ef0c9-bccf-4dbb-9bd6-f4d2488c1172.png",
  Rocket: "https://raw.githubusercontent.com/ariyanth1000-jpg/Rocket-logo/main/rocket-color-logo-mobile-banking-icon-free-png.png",
  Binance: "https://raw.githubusercontent.com/ariyanth1000-jpg/Binance-logo/main/Binace.png"
};

const loading = document.getElementById("loading");
const searchBox = document.getElementById("searchBox");
const result = document.getElementById("result");
const amountArea = document.getElementById("amountArea");
const amountBox = document.getElementById("amountBox");
const methodBox = document.getElementById("methodBox");
const payableBox = document.getElementById("payableBox");
const methodValueBox = document.getElementById("methodValueBox");

let currentStudentId = "";
let maxAmount = 0;
let methodValues = {};

window.onload = function(){
  const savedValue = localStorage.getItem("student_search") || "";

  searchBox.classList.add("hidden");
  amountArea.classList.add("hidden");

  if(savedValue !== ""){
    searchBox.value = savedValue;
    searchNow();
  }else{
    loading.style.display = "none";
    searchBox.classList.remove("hidden");
    result.innerHTML = "Password Auth RequiredPassword AuthPassword AuthPassword Auth";
  }
};

searchBox.addEventListener("input", function(){
  localStorage.setItem("student_search", this.value);
  searchNow();
});

methodBox.addEventListener("change", updateMethodValue);

amountBox.addEventListener("input", function(){
  let value = Number(this.value) || 0;

  if(value > maxAmount){
    value = maxAmount;
    this.value = maxAmount;
  }

  if(value < 0){
    this.value = "";
    value = 0;
  }

  let payable = value - 5;
  if(payable < 0) payable = 0;

  payableBox.innerHTML = "Payable : " + payable + " TK";
});

function updateMethodValue(){
  const method = methodBox.value;
  const value = methodValues[method] || "-";
  const logo = methodLogos[method] || "";

  methodValueBox.innerHTML = `
    <div class="methodCard">
      <img class="methodLogo" src="${logo}" onerror="this.style.display='none';">
      <div>
        <div class="methodName">${method}</div>
        <div class="methodValue">${value}</div>
      </div>
    </div>
  `;
}

function searchNow(){
  const value = searchBox.value.trim();

  if(value === ""){
    loading.style.display = "none";
    searchBox.classList.remove("hidden");
    amountArea.classList.add("hidden");
    result.className = "result";
    result.innerHTML = "Password Auth";
    return;
  }

  loading.style.display = "flex";
  loading.innerHTML = "🖨️ Profile Scaning.....";
  result.innerHTML = "";
  amountArea.classList.add("hidden");

  fetch(WEB_APP_URL + "?action=search&value=" + encodeURIComponent(value))
  .then(res => res.json())
  .then(data => {
    loading.style.display = "none";

    if(data.found){
      currentStudentId = data.jValue;
      maxAmount = Number(data.oValue) || 0;

      methodValues = {
        Bkash: data.bkash,
        Nagad: data.nagad,
        Rocket: data.rocket,
        Binance: data.binance
      };

      searchBox.classList.add("hidden");

      result.className = "result success";
      result.innerHTML = "Available Balance: " + maxAmount + " TK";

      methodBox.innerHTML = "";

      if(data.bkash !== "" && data.bkash !== null){
        methodBox.innerHTML += `<option value="Bkash">Bkash</option>`;
      }

      if(data.nagad !== "" && data.nagad !== null){
        methodBox.innerHTML += `<option value="Nagad">Nagad</option>`;
      }

      if(data.rocket !== "" && data.rocket !== null){
        methodBox.innerHTML += `<option value="Rocket">Rocket</option>`;
      }

      if(data.binance !== "" && data.binance !== null){
        methodBox.innerHTML += `<option value="Binance">Binance</option>`;
      }

      amountBox.value = "";
      amountBox.max = maxAmount;
      payableBox.innerHTML = "Payable : 0 TK";

      amountArea.classList.remove("hidden");

      if(methodBox.options.length === 0){
        result.className = "result error";
        result.innerHTML = "❌ No payment method found";
        amountArea.classList.add("hidden");
        return;
      }

      updateMethodValue();

    }else{
      searchBox.classList.remove("hidden");
      amountArea.classList.add("hidden");
      result.className = "result error";
      result.innerHTML = "❌ Not Found";
    }
  })
  .catch(error => {
    loading.style.display = "none";
    searchBox.classList.remove("hidden");
    amountArea.classList.add("hidden");
    result.className = "result error";
    result.innerHTML = "❌ Server Error";
  });
}

function submitAmount(){
  const amount = Number(amountBox.value);
  const method = methodBox.value;

  if(!method){
    result.className = "result error";
    result.innerHTML = "Select  Payment Method";
    return;
  }

  if(!amount || amount <= 0){
    result.className = "result error";
    result.innerHTML = "Enter Amount";
    return;
  }

  if(amount > maxAmount){
    amountBox.value = maxAmount;
    result.className = "result error";
    result.innerHTML = "Balance এর বেশি লেখা যাবে না";
    return;
  }

  loading.style.display = "flex";
  loading.innerHTML = "Submitting...";

  fetch(
    WEB_APP_URL +
    "?action=submit" +
    "&id=" + encodeURIComponent(currentStudentId) +
    "&amount=" + encodeURIComponent(amount) +
    "&method=" + encodeURIComponent(method)
  )
  .then(res => res.json())
  .then(data => {
    loading.style.display = "none";
    loading.innerHTML = "Searching...";

    if(data.success){

  document.body.innerHTML = `
  <div style="
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
      radial-gradient(circle at top left,rgba(59,130,246,.45),transparent 35%),
      radial-gradient(circle at bottom right,rgba(34,197,94,.35),transparent 40%),
      #07132d;
    padding:20px;
    font-family:'Segoe UI',Arial,sans-serif;
  ">

    <div style="
      width:100%;
      max-width:520px;
      text-align:center;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(34,197,94,.35);
      border-radius:30px;
      padding:40px 25px;
      box-shadow:0 0 50px rgba(34,197,94,.45);
    ">

      <div style="
        width:120px;
        height:120px;
        border-radius:50%;
        background:#22c55e;
        margin:auto;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:65px;
        color:white;
      ">
        ✓
      </div>

      <h1 style="
        margin-top:25px;
        font-size:38px;
        color:white;
      ">
        REQUEST SUCCESSFUL
      </h1>

      <p style="
        margin-top:15px;
        color:#cbd5e1;
        font-size:18px;
        line-height:1.8;
      ">
        Your withdrawal request has been received successfully.
        <br><br>
        Please wait while your company CEO reviews your request.
      </p>

      <div style="
        margin-top:25px;
        padding:15px;
        border-radius:15px;
        background:rgba(34,197,94,.15);
        color:#4ade80;
        font-weight:bold;
      ">
        Status : Pending Review
      </div>

    </div>

  </div>
  `;

}else{
    
      result.className = "result error";
      result.innerHTML = "❌ Submit Failed";
    }
  })
  .catch(error => {
    loading.style.display = "none";
    loading.innerHTML = "Searching...";
    result.className = "result error";
    result.innerHTML = "❌ Server Error";
  });
}
</script>

</body>
</html>
